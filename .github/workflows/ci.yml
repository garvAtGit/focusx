name: Continuous Integration & Query Governance

on:
  push:
    branches: [ master, main, redis-final ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-governance:
    name: 🛡️ Code Governance & Anti-Loop Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/focusx_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/focusx_test"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-supabase-anon-key"
      UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "mock-token"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --prefer-offline

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Execute Professional E2E & Query Governance Suite
        run: npm run test:ci

  build-verification:
    name: 🚀 Production Build Verification
    needs: quality-and-governance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: production
      CI: true
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/focusx_ci_build"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/focusx_ci_build"
      NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-supabase-anon-key"
      UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "mock-token"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci || npm install --prefer-offline

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application (Webpack Engine)
        run: npx next build --webpack

